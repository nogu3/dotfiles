# Renovate の自動マージは CI 緑が前提。使っているのは init.sh（mise / dotter）なので
# その構文だけ見る。sandbox 用 Dockerfile は 2026-10 時点で build が壊れたまま未使用のため
# 対象外（renovate.json でも docker 系 manager を止めている）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash -n init.sh
        run: bash -n init.sh
