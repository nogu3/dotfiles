# Renovate の自動マージは CI 緑が前提。ベースイメージ更新で sandbox が
# build できなくなっていないかだけ見る。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build --build-arg USER_ID=1000 --build-arg GROUP_ID=1000 --build-arg USER_NAME=ci -t dotfiles-sandbox:ci .
